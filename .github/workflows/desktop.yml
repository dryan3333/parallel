name: Desktop installers
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac --arm64 --x64 --publish never
          - os: windows-latest
            cmd: npx electron-builder --win --x64 --publish never
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
